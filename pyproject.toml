[project]
name = "votesync"
version = "0.1.0"
description = "Projeto FastAPI com PostgreSQL em containers"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary]",
    "sqlalchemy",
    "python-dotenv",
    "passlib[bcrypt]",
    "bcrypt==4.0.1",
    "email-validator"
]

[tool.uv]
package = false

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoteSync - Grupos</title>
    <!-- Importação da fonte Google Inter para um aspeto moderno e limpo -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Vinculação do ficheiro CSS separado -->
    <link rel="stylesheet" href="../Styles/groups.css">
</head>

<body>

    <!-- CABEÇALHO DA PÁGINA -->
    <header class="navbar">
        <a href="../HTML/index.html" class="logo-area">
            <img class="logo-icon" src="../IMG/votesync_logo.png" alt="VoteSync logo" />
            <span class="logo-text">VoteSync</span>
        </a>

        <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" placeholder="Search for friends">
        </div>

        <div class="nav-actions">
            <button class="btn-logout">
                <img class="logout-icon" src="../IMG/Logout.png" alt="Logout icon" />
                Logout
            </button>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-container">
        <h1 class="main-title">Groups</h1>
        <p class="main-subtitle">0 groups you're part of</p>

        <!-- SEÇÃO ESTADO VAZIO -->
        <section class="empty-state-container">
            <div class="empty-state-card">
                <div class="empty-icon">👥</div>
                <h2>Ainda não geres nenhum grupo</h2>
                <p>Cria o teu primeiro grupo para começares a organizar votações e a tomar decisões em conjunto de forma
                    simples e digital.</p>
                <button class="btn-create-first">Criar o meu primeiro grupo</button>
            </div>
        </section>
    </main>

</body>

</html>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoteSync</title>
    <link rel="stylesheet" href="../Styles/dashboard.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="brand">
            <span class="brand-icon" aria-hidden="true">
                <a href="../HTML/index.html"><img src="../IMG/votesync_logo.png" alt="VoteSync logo" /></a>
            </span>
            <span>VoteSync</span>
        </div>

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search for friends">
        </div>

        <div class="nav-actions">
            <button class="logout-btn">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </button>
        </div>
    </header>

    <!-- Dashboard -->
    <main class="dashboard">

        <!-- Amigos -->
        <section class="card">
            <div class="card-header">
                <h2><i class="fa-regular fa-user"></i> Amigos</h2>
                <button class="small-btn">+</button>
            </div>

            <div class="list-item">
                <span>Sem amigos</span>
            </div>

            <button class="view-btn">
                View More <i class="fa-solid fa-angle-right"></i>
            </button>
        </section>

        <!-- Próximo Destino -->
        <section class="card">
            <h2>Decisões Criadas</h2>

            <div class="info-box">
                <span>Estado:</span>
                <strong>Sem decisões</strong>
            </div>

            <div class="winner-box">
                <small>Quando criares uma decisão, vai aparecer aqui.</small>
                <h3>-</h3>
            </div>

            <button class="view-btn">
                View More <i class="fa-solid fa-angle-right"></i>
            </button>
        </section>

        <!-- Grupos -->
        <section class="card">
            <div class="card-header">
                <h2><i class="fa-regular fa-user"></i> Grupos</h2>
                <button class="small-btn">+</button>
            </div>

            <div class="list-item">
                <span>Sem grupos</span>
            </div>

            <button class="view-btn">
                View More <i class="fa-solid fa-angle-right"></i>
            </button>
        </section>

        <!-- Restaurante -->
        <section class="card">
            <h2>Decisões Criadas</h2>

            <div class="info-box">
                <span>Estado:</span>
                <strong>Sem decisões</strong>
            </div>

            <div class="winner-box">
                <small>Quando criares uma decisão, vai aparecer aqui.</small>
                <h3>-</h3>
            </div>

            <button class="view-btn">
                View More <i class="fa-solid fa-angle-right"></i>
            </button>
        </section>

    </main>

</body>
</html>
